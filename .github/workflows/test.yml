name: Run Jest Tests

on:
  push:            # works on any local push to origin
  pull_request:
    branches:
      - master
  pull_request_target:
    branches:
      - master

env:
  NODE_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ALL tests with coverage
        run: yarn test --coverage
        env:
          NODE_ENV: test
          CI: true
          DEBUG: true
          CHAT_MODEL: gpt-4o-mini
          EMBEDDING_MODEL: text-embedding-3-large
          PINECONE_API_KEY: xxxxxxxx
          PINECONE_INDEX: presidents
          PINECONE_INDEX_DEV: presidents-dev
          VECTOR_SIZE: 3072
          CLIENT_SECRET_FILE: xxxxxxx
          DEFAULT_THRESHOLD: 0.4
          CLIENT_SECRET_FILE_FOGCITYMARATHONER_LIST_FILES_2: XXXXXXX

      - name: Create artifact name with context
        id: artifact-name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            NAME="pr-${{ github.event.pull_request.number }}-${{ github.head_ref }}"
          else
            NAME="${{ github.ref_name }}"
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $NAME"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ steps.artifact-name.outputs.name }}-${{ github.run_id }}
          path: coverage/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ steps.artifact-name.outputs.name }}-${{ github.run_id }}
          path: |
            coverage/
            test-results.json
          retention-days: 7