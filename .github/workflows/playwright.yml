name: Playwright Tests
on:
  push:
  pull_request:
    branches:
      - master
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed commit or PR merge result
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: yarn install
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps
      - name: Run Playwright tests with coverage thresholds
        run: yarn test:e2e:coverage
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: NEXT_PUBLIC_FIREBASE_PROJECT_ID
          NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL: NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL
          NEXT_PUBLIC_FIREBASE_PRIVATE_KEY: NEXT_PUBLIC_FIREBASE_PRIVATE_KEY
          NEXT_PUBLIC_FIREBASE_API_KEY: NEXT_PUBLIC_FIREBASE_API_KEY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            coverage/playwright/
          retention-days: 30
