name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: nextjs-app
  REGION: us-central1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Debug - Check if secrets are set
        run: |
          echo "=========================================="
          echo "🔍 Checking if GitHub Secrets are set..."
          echo "=========================================="
          echo ""
          echo "✅ NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL: ${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_PRIVATE_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_PRIVATE_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo ""
          echo "=========================================="
          echo "If any secrets show ❌ NOT SET, add them in:"
          echo "GitHub Repo → Settings → Secrets and variables → Actions"
          echo "=========================================="

      - name: Run tests
        run: yarn test --coverage
        env:
          NODE_ENV: test
          CI: true
          DEFAULT_THRESHOLD: ''
          PINECONE_API_KEY: xxxxxxxx
          PINECONE_INDEX: presidents
          CLIENT_SECRET_FILE: xxxxxxx
          CLIENT_SECRET_FILE_FOGCITYMARATHONER_LIST_FILES_2: XXXXXXX

      - name: Build Next.js app
        run: yarn build
        env:
          # Required for build
          NODE_ENV: production
          # Firebase config
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL: ${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL }}
          NEXT_PUBLIC_FIREBASE_PRIVATE_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_PRIVATE_KEY }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          # API Keys
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Other env vars
          CHAT_MODEL: gpt-4o-mini
          EMBEDDING_MODEL: text-embedding-3-large
          VECTOR_SIZE: 3072
          DEFAULT_THRESHOLD: 0.5
          PINECONE_INDEX_DEV: presidents-dev
          DEBUG: true
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      # Verify build exists
      - name: Verify build
        run: |
          echo "Contents of current directory:"
          ls -la
          echo ""
          if [ -d ".next" ]; then
            echo "✅ .next directory exists"
            echo "Contents of .next:"
            ls -la .next
            if [ -f ".next/BUILD_ID" ]; then
              echo "✅ BUILD_ID: $(cat .next/BUILD_ID)"
            else
              echo "❌ BUILD_ID file missing"
              exit 1
            fi
            if [ -f ".next/standalone/server.js" ]; then
              echo "✅ Standalone server exists"
            else
              echo "❌ .next/standalone/server.js missing"
              exit 1
            fi
          else
            echo "❌ .next directory does not exist"
            echo "Checking if build failed..."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          include-hidden-files: true
          path: |
            .next/standalone
            .next/static
            .next/BUILD_ID
            public
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      # Verify downloaded artifacts
      - name: Verify downloaded artifacts
        run: |
          echo "Checking downloaded artifacts..."
          echo "Contents of current directory:"
          ls -la
          echo ""
          if [ -d ".next" ]; then
            echo "✅ .next directory exists"
            echo "Contents of .next:"
            ls -la .next
            if [ -f ".next/BUILD_ID" ]; then
              echo "✅ BUILD_ID: $(cat .next/BUILD_ID)"
            else
              echo "❌ BUILD_ID file missing in downloaded artifacts"
              exit 1
            fi
            if [ -f ".next/standalone/server.js" ]; then
              echo "✅ Standalone server exists in downloaded artifacts"
            else
              echo "❌ .next/standalone/server.js missing in downloaded artifacts"
              exit 1
            fi
          else
            echo "❌ .next directory not found in downloaded artifacts"
            exit 1
          fi

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM node:20-slim
          WORKDIR /app
          ENV NODE_ENV=production
          ENV NEXT_TELEMETRY_DISABLED=1
          ENV PORT=3000
          ENV HOSTNAME="0.0.0.0"
          COPY .next/standalone ./
          COPY .next/static ./.next/static
          COPY public ./public
          EXPOSE 3000
          CMD ["node", "server.js"]
          EOF

          cat > .dockerignore << 'EOF'
          *
          !.next
          !.next/standalone
          !.next/standalone/**
          !.next/static
          !.next/static/**
          !public
          !public/**
          !Dockerfile
          EOF

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          echo "✅ Docker configured for Artifact Registry"

      - name: Build and push Docker image
        run: |
          # Build the Docker image locally and push to Artifact Registry
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "Building image: $IMAGE_URI"
          docker build -t $IMAGE_URI .
          echo "✅ Docker image built successfully"
          echo "Pushing image: $IMAGE_URI"
          docker push $IMAGE_URI
          echo "✅ Docker image pushed successfully"

      - name: Deploy to Cloud Run
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "Deploying image: $IMAGE_URI"
          ENV_VARS="^~^PINECONE_API_KEY=${PINECONE_API_KEY}"
          ENV_VARS="${ENV_VARS}~OPENAI_API_KEY=${OPENAI_API_KEY}"
          ENV_VARS="${ENV_VARS}~CHAT_MODEL=gpt-4o-mini"
          ENV_VARS="${ENV_VARS}~EMBEDDING_MODEL=text-embedding-3-large"
          ENV_VARS="${ENV_VARS}~VECTOR_SIZE=3072"
          ENV_VARS="${ENV_VARS}~DEFAULT_THRESHOLD=0.5"
          ENV_VARS="${ENV_VARS}~PINECONE_INDEX_DEV=presidents-dev"
          ENV_VARS="${ENV_VARS}~DEBUG=true"
          ENV_VARS="${ENV_VARS}~NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}"
          ENV_VARS="${ENV_VARS}~NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}"
          ENV_VARS="${ENV_VARS}~NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}"
          ENV_VARS="${ENV_VARS}~NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}"
          ENV_VARS="${ENV_VARS}~NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}"
          ENV_VARS="${ENV_VARS}~NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}"
          ENV_VARS="${ENV_VARS}~NEXT_PUBLIC_FIRESTORE_DATABASE_ID=${NEXT_PUBLIC_FIRESTORE_DATABASE_ID}"
          ENV_VARS="${ENV_VARS}~FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}"
          ENV_VARS="${ENV_VARS}~FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}"
          ENV_VARS="${ENV_VARS}~FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $IMAGE_URI \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "$ENV_VARS"
          echo "✅ Deployment complete!"
