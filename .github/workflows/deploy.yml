name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: nextjs-app
  REGION: us-central1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Debug - Check if secrets are set
        run: |
          echo "=========================================="
          echo "🔍 Checking if GitHub Secrets are set..."
          echo "=========================================="
          echo ""
          echo "✅ NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL: ${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_FIREBASE_PRIVATE_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_PRIVATE_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL != '' && '✅ SET' || '❌ NOT SET' }}"
          echo "✅ GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' && '✅ SET' || '❌ NOT SET' }}"
          echo ""
          echo "=========================================="
          echo "If any secrets show ❌ NOT SET, add them in:"
          echo "GitHub Repo → Settings → Secrets and variables → Actions"
          echo "=========================================="

      - name: Run tests
        run: yarn test --coverage
        env:
          NODE_ENV: test
          CI: true
          DEFAULT_THRESHOLD: ''
          PINECONE_API_KEY: xxxxxxxx
          PINECONE_INDEX: presidents
          CLIENT_SECRET_FILE: xxxxxxx
          CLIENT_SECRET_FILE_FOGCITYMARATHONER_LIST_FILES_2: XXXXXXX

      - name: Build Next.js app
        run: yarn build
        env:
          # Required for build
          NODE_ENV: production
          NEXT_PHASE: phase-production-build
          # Firebase config
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL: ${{ secrets.NEXT_PUBLIC_FIREBASE_CLIENT_EMAIL }}
          NEXT_PUBLIC_FIREBASE_PRIVATE_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_PRIVATE_KEY }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          # API Keys
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Other env vars
          CHAT_MODEL: gpt-4o-mini
          EMBEDDING_MODEL: text-embedding-3-large
          VECTOR_SIZE: 3072
          DEFAULT_THRESHOLD: 0.5
          PINECONE_INDEX_DEV: presidents-dev
          DEBUG: true
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      # Verify build exists
      - name: Verify build
        run: |
          echo "Contents of current directory:"
          ls -la
          echo ""
          if [ -d ".next" ]; then
            echo "✅ .next directory exists"
            echo "Contents of .next:"
            ls -la .next
            if [ -f ".next/BUILD_ID" ]; then
              echo "✅ BUILD_ID: $(cat .next/BUILD_ID)"
            else
              echo "❌ BUILD_ID file missing"
              exit 1
            fi
          else
            echo "❌ .next directory does not exist"
            echo "Checking if build failed..."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next
            node_modules
            public
            package.json
            yarn.lock
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      # Verify downloaded artifacts
      - name: Verify downloaded artifacts
        run: |
          echo "Checking downloaded artifacts..."
          echo "Contents of current directory:"
          ls -la
          echo ""
          if [ -d ".next" ]; then
            echo "✅ .next directory exists"
            echo "Contents of .next:"
            ls -la .next
            if [ -f ".next/BUILD_ID" ]; then
              echo "✅ BUILD_ID: $(cat .next/BUILD_ID)"
            else
              echo "❌ BUILD_ID file missing in downloaded artifacts"
              exit 1
            fi
          else
            echo "❌ .next directory not found in downloaded artifacts"
            exit 1
          fi

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM node:20-slim
          WORKDIR /app
          ENV NODE_ENV=production
          ENV NEXT_TELEMETRY_DISABLED=1
          ENV PORT=3000
          ENV HOSTNAME="0.0.0.0"
          COPY .next ./.next
          COPY public ./public
          COPY package.json yarn.lock ./
          COPY node_modules ./node_modules
          EXPOSE 3000
          CMD ["yarn", "start"]
          EOF

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          # Build the Docker image locally and push to Artifact Registry
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $IMAGE_URI \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars \
              "PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }},\
              OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},\
              CHAT_MODEL=gpt-4o-mini,\
              EMBEDDING_MODEL=text-embedding-3-large,\
              VECTOR_SIZE=3072,\
              DEFAULT_THRESHOLD=0.5,\
              PINECONE_INDEX_DEV=presidents-dev,\
              DEBUG=true,\
              NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }},\
              NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }},\
              NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }},\
              NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }},\
              NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }},\
              NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}"